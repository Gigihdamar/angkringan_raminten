<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Pegawai - Angkringan Raminten</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="hero-angkringan" style="min-height:100vh; padding:0; --hero-photo:url('{{ url_for('static', filename='images/hero/suasana-3.jpg') }}');">
<a href="{{ url_for('customer.home') }}" class="login-back-link">
  <i class="bi bi-arrow-left"></i> Kembali ke Beranda
</a>
<div class="container py-5 d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div class="row justify-content-center w-100">
    <div class="col-md-5">
      <div class="text-center mb-4">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo Angkringan Raminten" class="brand-logo brand-logo--lg mx-auto d-block">
        <h3 class="display-font fw-bold" style="color:var(--gold-400);">Admin Executive Login</h3>
        <p class="text-white-50">Masuk untuk mengelola pesanan Angkringan Raminten</p>
      </div>

      <div class="ticket-card p-4" style="background:var(--cream-50);">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ 'success' if category=='success' else category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input type="text" name="username" class="form-control" placeholder="Masukkan username" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Masukkan password" required>
          </div>
          <button type="submit" class="btn btn-pesan w-100">
            <i class="bi bi-box-arrow-in-right"></i> Login
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
